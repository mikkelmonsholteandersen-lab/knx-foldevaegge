<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KNX Foldevægge – Hal</title><style>body{margin:0;background:#0b1220;color:#f8fafc;font-family:system-ui,Arial;padding:24px}main{max-width:620px;margin:auto}h1{font-size:1.8rem}p{color:#cbd5e1}.hall{display:flex;border:3px solid #94a3b8;border-radius:12px;overflow:hidden;height:190px;background:#17253b;margin:25px 0}.zone{flex:1;display:grid;place-content:center;text-align:center;position:relative}.zone+.zone{border-left:5px dashed #4ade80}.zone.closed{border-left:7px solid #f59e0b}.zone b{font-size:1.2rem}.zone small{color:#cbd5e1;margin-top:8px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.control{background:#1e293b;padding:16px;border-radius:12px}button{width:100%;padding:15px;margin-top:12px;background:#2563eb;color:white;border:0;border-radius:9px;font-weight:700;font-size:1rem;cursor:pointer}button[aria-pressed=true]{background:#b45309}.status{margin-top:18px;padding:16px;border-radius:12px;background:#1e293b;line-height:1.6}footer{font-size:.85rem;color:#94a3b8;margin-top:24px}@media(max-width:420px){body{padding:15px}.controls{grid-template-columns:1fr}.hall{height:155px}}</style></head><body><main><h1>KNX – Styring af foldevægge</h1><p>Tryk på knapperne for at åbne eller lukke foldevæggene mellem hallens tre zoner.</p><div class="hall"><div class="zone"><b>Zone 1</b><small id="z1">Område 1</small></div><div class="zone" id="zone2"><b>Zone 2</b><small id="z2">Område 2</small></div><div class="zone" id="zone3"><b>Zone 3</b><small id="z3">Område 3</small></div></div><div class="controls"><div class="control"><strong>Foldevæg 1</strong><button id="w1" aria-pressed="true">Lukket · tryk for at åbne</button></div><div class="control"><strong>Foldevæg 2</strong><button id="w2" aria-pressed="true">Lukket · tryk for at åbne</button></div></div><div class="status" id="status" role="status"></div><footer>Interaktiv demonstration til KNX-fremlæggelse. Styrer ikke fysisk KNX-udstyr.</footer></main><script>let closed=[true,true];function render(){closed.forEach((c,i)=>{const b=document.getElementById('w'+(i+1));b.textContent=c?'Lukket · tryk for at åbne':'Åben · tryk for at lukke';b.setAttribute('aria-pressed',String(c));document.getElementById('zone'+(i+2)).classList.toggle('closed',c)});let groups=[];let current=[1];for(let i=0;i<2;i++){if(closed[i]){groups.push(current);current=[i+2]}else current.push(i+2)}groups.push(current);document.getElementById('status').innerHTML='<strong>Aktuel zoneinddeling</strong><br>'+groups.map(g=>'Zone '+g.join(' + ')).join('<br>')+'<br><br>'+groups.length+' selvstændig(e) lysområde(r)';}closed.forEach((_,i)=>document.getElementById('w'+(i+1)).addEventListener('click',()=>{closed[i]=!closed[i];render()}));render();</script></body></html>
